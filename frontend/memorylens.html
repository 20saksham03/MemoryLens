<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MemoryLens</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#FAFAF8; --paper-dim:#F1F0EB; --panel:#FFFFFF; --ink:#15171B;
  --sub:#6B6E76; --faint:#9A9DA4; --border:#E6E4DE; --border-strong:#D6D3CA;
  --brand:#3454D1; --brand-dim:#EBEFFC; --brand-ink:#22347E;
  --shopping:#B4762A; --shopping-bg:#FBF1E4;
  --travel:#1E7F73; --travel-bg:#E9F5F2;
  --recipes:#4C7C3F; --recipes-bg:#EFF6EA;
  --bills:#B0483F; --bills-bg:#FBEBE9;
  --education:#6349A8; --education-bg:#F1ECFA;
  --documents:#565A63; --documents-bg:#F0EFEC;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
svg{display:block;}

/* layout */
#root{display:flex;height:100vh;width:100%;overflow:hidden;}
.sidebar{display:none;flex-direction:column;width:240px;flex-shrink:0;height:100%;padding:20px 16px;border-right:1px solid var(--border);background:var(--panel);}
.main-col{flex:1;display:flex;flex-direction:column;overflow-y:auto;}
.view-wrap{flex:1;padding-bottom:0;}
.container{max-width:1000px;margin:0 auto;padding:32px 20px;}
.container-sm{max-width:720px;margin:0 auto;padding:32px 20px;}
.container-md{max-width:660px;margin:0 auto;padding:32px 20px;}
@media(min-width:768px){
  .sidebar{display:flex;}
  .mobile-top,.mobile-tab{display:none !important;}
  .container,.container-sm,.container-md{padding:40px 32px;}
  .view-wrap{padding-bottom:0 !important;}
}
@media(max-width:767px){ .view-wrap{padding-bottom:64px;} }

/* logo */
.logo{display:flex;align-items:center;gap:8px;}
.logo-mark{width:32px;height:32px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;}
.logo-text{font-weight:600;font-size:19px;letter-spacing:-0.01em;}

/* sidebar nav */
.nav-section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--faint);padding:0 10px;margin:0 0 8px;}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--sub);text-align:left;transition:background .15s;}
.nav-item.active{background:var(--brand-dim);color:var(--brand-ink);}
.nav-item:hover:not(.active){background:#F7F7F5;}
.cat-nav-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:8px;font-size:14px;color:var(--ink);}
.cat-nav-item:hover{background:#F7F7F5;}
.cat-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);}

/* mobile nav */
.mobile-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--border);}
.mobile-tab{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;align-items:center;padding:8px 0;z-index:30;background:var(--panel);border-top:1px solid var(--border);}
.mobile-tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px;color:var(--faint);}
.mobile-tab-item.active{color:var(--brand);}
.mobile-tab-item span{font-size:10px;font-weight:500;}

/* buttons */
.btn-primary{background:var(--brand);color:#fff;font-weight:500;font-size:14px;padding:12px 20px;border-radius:12px;}
.btn-primary-sm{background:var(--brand);color:#fff;font-weight:500;font-size:12px;padding:8px 14px;border-radius:8px;}
.btn-secondary-sm{background:var(--panel);border:1px solid var(--border);color:var(--sub);font-weight:500;font-size:12px;padding:6px 12px;border-radius:8px;}

/* search input */
.search-form{position:relative;margin-bottom:16px;}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--faint);}
.search-input{width:100%;padding:14px 16px 14px 44px;border-radius:12px;border:1px solid var(--border);background:var(--panel);font-size:14px;color:var(--ink);outline:none;}
.search-input:focus{box-shadow:0 0 0 3px var(--brand-dim);}
.search-submit{position:absolute;right:8px;top:50%;transform:translateY(-50%);}

/* chips */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;}
.chip{font-size:12px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--border);color:var(--sub);}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:36px;}
@media(min-width:768px){.stat-grid{grid-template-columns:repeat(5,1fr);}}
.stat-card{border-radius:12px;padding:16px;background:var(--panel);border:1px solid var(--border);}
.stat-card.primary{background:var(--brand);color:#fff;grid-column:span 2;}
@media(min-width:768px){.stat-card.primary{grid-column:span 1;}}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;}
.stat-label{font-size:12px;opacity:.85;margin-top:2px;}
.stat-card:not(.primary) .stat-label{color:var(--sub);opacity:1;}

/* category grid */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:40px;}
@media(min-width:768px){.cat-grid{grid-template-columns:repeat(6,1fr);}}
.cat-card{border-radius:12px;padding:14px;text-align:left;transition:transform .15s;}
.cat-card:hover{transform:translateY(-2px);}
.cat-card-name{font-size:12px;font-weight:500;margin-top:8px;}
.cat-card-count{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:2px;}

/* section title */
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title h2{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin:0;}

/* screenshot grid */
.shot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:768px){.shot-grid{grid-template-columns:repeat(4,1fr);}}
.shot-grid.cols-3{grid-template-columns:repeat(2,1fr);}
@media(min-width:768px){.shot-grid.cols-3{grid-template-columns:repeat(3,1fr);}}

/* screenshot card */
.shot-card{text-align:left;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--border);transition:transform .15s;}
.shot-card:hover{transform:translateY(-2px);}
.shot-visual{position:relative;overflow:hidden;border-radius:10px;}
.shot-visual-inner{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;}
.shot-card-body{padding:12px;}
.shot-card-title{font-size:14px;font-weight:500;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.shot-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.shot-card-summary{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* badges */
.badge-intent{display:inline-flex;align-items:center;gap:4px;border-radius:999px;font-weight:500;font-size:11px;padding:2px 8px;background:var(--brand-dim);color:var(--brand-ink);}
.badge-intent.md{font-size:12px;padding:4px 10px;}
.badge-category{display:inline-flex;align-items:center;gap:4px;border-radius:999px;font-weight:500;font-size:11px;padding:2px 8px;}

/* relevance */
.relevance{display:flex;align-items:center;gap:8px;}
.relevance-track{height:4px;width:56px;border-radius:999px;background:var(--border);overflow:hidden;}
.relevance-fill{height:100%;border-radius:999px;background:var(--brand);}
.relevance-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sub);}

/* scanline */
.scanline{position:absolute;left:0;right:0;height:26%;background:linear-gradient(180deg,transparent,rgba(52,84,209,.16),transparent);animation:scan 1.4s linear infinite;}
@keyframes scan{0%{top:-10%}100%{top:110%}}
.fade-in{animation:fadein .25s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* step checklist */
.step-panel{border-radius:12px;padding:24px;background:var(--panel);border:1px solid var(--border);max-width:360px;}
.step-item{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;}
.step-item:last-child{margin-bottom:0;}
.step-dot-pending{width:15px;height:15px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;}
.step-dot-active{width:15px;height:15px;border-radius:50%;background:var(--brand);flex-shrink:0;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* upload */
.dropzone{border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px;margin-bottom:20px;border:1.5px dashed var(--border-strong);background:var(--panel);transition:.15s;}
.dropzone.drag{border-color:var(--brand);background:var(--brand-dim);}
.dropzone-icon{width:44px;height:44px;border-radius:50%;background:var(--brand-dim);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.upload-preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
@media(min-width:768px){.upload-preview-grid{grid-template-columns:repeat(4,1fr);}}
.upload-preview-item{position:relative;}
.upload-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;}
.upload-add-btn{height:80px;border-radius:8px;border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint);cursor:pointer;}

/* detail */
.back-btn{display:flex;align-items:center;gap:4px;margin-bottom:20px;font-size:14px;color:var(--sub);}
.ai-read-tag{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--brand);margin:12px 0 28px;}
.understand-panel{border-radius:12px;padding:20px;background:var(--panel);border:1px solid var(--border);margin-bottom:32px;}
.understand-row{display:flex;gap:12px;padding-left:12px;border-left:2px solid var(--border);margin-bottom:16px;}
.understand-row:last-child{margin-bottom:0;}
.understand-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);padding-top:2px;flex-shrink:0;}
.understand-label{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);margin-bottom:4px;}
.keyword-chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--paper-dim);color:var(--sub);}
.delete-confirm{border-radius:12px;padding:16px;background:var(--bills-bg);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}

/* chat */
.chat-wrap{display:flex;flex-direction:column;min-height:70vh;}
.chat-messages{flex:1;}
.bubble-row{display:flex;margin-bottom:16px;}
.bubble-row.user{justify-content:flex-end;}
.bubble-row.assistant{justify-content:flex-start;}
.bubble{max-width:85%;font-size:14px;padding:10px 16px;border-radius:18px;}
@media(min-width:768px){.bubble{max-width:70%;}}
.bubble.user{background:var(--brand);color:#fff;border-bottom-right-radius:4px;}
.bubble.assistant{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px;}
.bubble-sources{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;}
.bubble-source-card{text-align:left;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--panel);}
.bubble-source-title{font-size:11px;font-weight:500;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.typing-bubble{display:inline-flex;gap:4px;padding:12px 16px;border-radius:18px;border-bottom-left-radius:4px;background:var(--panel);border:1px solid var(--border);}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:pulse 1s ease-in-out infinite;}
.chat-input-form{position:relative;margin-top:16px;}
.chat-input{width:100%;padding:12px 44px 12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--panel);font-size:14px;outline:none;}
.chat-send{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;}

/* empty states */
.empty-state{text-align:center;padding:56px 0;}
.empty-state .title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:500;margin-bottom:4px;}
.empty-state .sub{font-size:14px;color:var(--sub);}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================== ICONS ============================== */
function icon(name, size, color, sw){
  size = size || 16; color = color || 'currentColor'; sw = sw || 2;
  const paths = {
    grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    upload:'<path d="M12 15V3"/><polyline points="7 8 12 3 17 8"/><path d="M5 21h14"/>',
    chat:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.35 0-2.62-.32-3.75-.9L3 21l1.9-5.75A8.46 8.46 0 0 1 3.5 11.5 8.5 8.5 0 1 1 21 11.5Z"/>',
    cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
    plane:'<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5Z"/>',
    chef:'<path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/>',
    receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/>',
    grad:'<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>',
    file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>',
    chevronLeft:'<polyline points="15 18 9 12 15 6"/>',
    x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    send:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
    sparkles:'<path d="M12 2l1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5Z"/>',
    check:'<polyline points="20 6 9 17 4 12"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>'
  };
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+paths[name]+'</svg>';
}

/* ============================== DATA ============================== */
const CATEGORY_STYLE = {
  Shopping:{icon:'cart',color:'var(--shopping)',bg:'var(--shopping-bg)'},
  Travel:{icon:'plane',color:'var(--travel)',bg:'var(--travel-bg)'},
  Recipes:{icon:'chef',color:'var(--recipes)',bg:'var(--recipes-bg)'},
  Bills:{icon:'receipt',color:'var(--bills)',bg:'var(--bills-bg)'},
  Education:{icon:'grad',color:'var(--education)',bg:'var(--education-bg)'},
  Documents:{icon:'file',color:'var(--documents)',bg:'var(--documents-bg)'}
};
const INTENT_ICON = {"Buy Later":"🛒","Cook Later":"🍳","Upcoming Travel":"✈️","Pay Later":"💳","Study Later":"📚","Reference Later":"📌","Visit Later":"📍"};
const CATEGORIES = ["Shopping","Travel","Recipes","Bills","Education","Documents"];
const SUGGESTED_SEARCHES = ["Things I wanted to buy","Recipes I wanted to cook","My travel plans","Bills I need to pay","Important documents","Restaurant recommendations"];
const CHAT_SUGGESTIONS = ["What products did I save?","What recipes did I want to cook?","What are my upcoming trips?","What bills do I need to pay?","Show my important documents."];
const NAV_ITEMS = [
  {id:"dashboard",label:"Dashboard",icon:"grid"},
  {id:"search",label:"Search",icon:"search"},
  {id:"upload",label:"Upload",icon:"upload"},
  {id:"chat",label:"AI Assistant",icon:"chat"}
];

/* ============================== STATE ============================== */
const state = {
  view:"dashboard", selectedId:null, activeCategory:null, detailHistory:"dashboard",
  dashQuery:"",
  search:{query:"", stage:"idle", step:0, results:[], label:"", timers:[]},
  upload:{files:[], stage:"select", step:0, dragOver:false, timers:[]},
  chat:{messages:[], input:"", typing:false},
  deleteConfirm:false, deleted:false,
  uploadedMemories: [] // Only search and show items that have been "uploaded"
};

/* ============================== HELPER ============================== */
function getCategoryCounts() {
  const counts = {}; 
  CATEGORIES.forEach(c=>counts[c]=state.uploadedMemories.filter(d=>d.category===c).length);
  return counts;
}

function runSearch(query){
  const q = (query||"").toLowerCase();
  let subset = [], label = "";
  
  // Only search within the uploaded memories
  const targetData = state.uploadedMemories;

  if(/buy|purchase|shop/.test(q)){ subset = targetData.filter(d=>d.category==="Shopping"); label="purchases you were considering"; }
  else if(/cook|recipe|food/.test(q)){ subset = targetData.filter(d=>d.category==="Recipes"); label="recipes you saved"; }
  else if(/restaurant/.test(q)){ subset = targetData.filter(d=> d.title.toLowerCase().includes("restaurant") || (d.category==="Travel" && d.intent==="Visit Later")); label="restaurant recommendations"; }
  else if(/travel|trip|flight|hotel/.test(q)){ subset = targetData.filter(d=>d.category==="Travel"); label="travel plans"; }
  else if(/bill|pay/.test(q)){ subset = targetData.filter(d=>d.category==="Bills"); label="bills pending payment"; }
  else if(/document|certificate|offer/.test(q)){ subset = targetData.filter(d=>d.category==="Documents"); label="documents you saved"; }
  else if(/study|note|exam|assignment/.test(q)){ subset = targetData.filter(d=>d.category==="Education"); label="study material"; }
  else{
    subset = targetData.filter(d=> d.title.toLowerCase().includes(q) || d.summary.toLowerCase().includes(q) || d.keywords.some(k=>k.toLowerCase().includes(q)));
    label = "matching memories";
  }
  const base=[96,91,87,83,79,75,71];
  const results = subset.slice(0,8).map((it,i)=>Object.assign({},it,{score: base[i] !== undefined ? base[i] : 68}));
  return {results,label};
}

function answerFor(q){
  const lower=(q||"").toLowerCase();
  let cat=null;
  if(/product|buy/.test(lower)) cat="Shopping";
  else if(/recipe|cook/.test(lower)) cat="Recipes";
  else if(/trip|travel/.test(lower)) cat="Travel";
  else if(/bill|pay/.test(lower)) cat="Bills";
  else if(/document/.test(lower)) cat="Documents";
  else if(/note|study|exam/.test(lower)) cat="Education";
  if(cat){
    // Only reference uploaded memories
    const items = state.uploadedMemories.filter(d=>d.category===cat).slice(0,5);
    const verbMap = {Shopping:"saved for later purchase",Recipes:"saved to cook",Travel:"saved related to travel",Bills:"pending payment",Documents:"saved as documents",Education:"saved for studying"};
    return {text:"I found "+items.length+" "+(cat==="Bills"?"bills":"items")+" "+verbMap[cat]+":", sources:items};
  }
  const r = runSearch(q);
  if(r.results.length) return {text:"I found "+r.results.length+" memories related to that:", sources:r.results.slice(0,4)};
  return {text:"I couldn't find anything matching that in your memories yet — try describing it differently.", sources:[]};
}

function clearTimers(arr){ arr.forEach(t=>clearTimeout(t)); arr.length=0; }

/* ============================== NAV ACTIONS ============================== */
function navigate(view){
  state.view = view; state.activeCategory = null;
  render();
}
function openCategory(cat){
  state.activeCategory = cat; state.view = "search";
  startCategorySearch(cat);
  render();
}
function openDetail(id){
  state.detailHistory = state.view; state.selectedId = id; state.view = "detail";
  state.deleteConfirm=false; state.deleted=false;
  render();
}
function backFromDetail(){ state.view = state.detailHistory; render(); }

/* ============================== DASHBOARD ============================== */
function dashboardSubmit(e){
  e.preventDefault();
  const val = document.getElementById("dash-search-input").value;
  state.view="search"; state.activeCategory=null;
  startTextSearch(val);
  render();
}

function renderDashboard(){
  // Update dashboard to only show actual uploaded files
  const recent = state.uploadedMemories.slice(-8).slice().reverse();
  const total = state.uploadedMemories.length;
  const currentCounts = getCategoryCounts();

  return '<div class="container fade-in">'
  +'<p style="font-size:14px;color:var(--sub);margin:0 0 4px;">Good morning 👋</p>'
  +'<h1 class="display" style="font-size:26px;font-weight:600;margin:0 0 24px;">Turn your screenshots into searchable memories.</h1>'
  +'<form class="search-form" onsubmit="dashboardSubmit(event)">'
    +'<span class="search-icon">'+icon("search",17,"var(--faint)")+'</span>'
    +'<input id="dash-search-input" class="search-input" placeholder="Search your memories..." />'
  +'</form>'
  +'<div class="stat-grid">'
    +'<div class="stat-card primary"><div class="stat-num">'+total.toLocaleString()+'</div><div class="stat-label">Screenshots</div></div>'
    +CATEGORIES.slice(0,4).map((cat)=>{
      return '<div class="stat-card"><div class="stat-num">'+currentCounts[cat]+'</div><div class="stat-label">'+cat+'</div></div>';
    }).join('')
  +'</div>'
  +'<div class="section-title"><h2>Categories</h2></div>'
  +'<div class="cat-grid">'
    +CATEGORIES.map(cat=>{
      const s=CATEGORY_STYLE[cat];
      return '<button class="cat-card" style="background:'+s.bg+'" onclick=\'openCategory("'+cat+'")\'>'
        +icon(s.icon,17,s.color)
        +'<div class="cat-card-name">'+cat+'</div>'
        +'<div class="cat-card-count" style="color:'+s.color+'">'+currentCounts[cat]+'</div>'
      +'</button>';
    }).join('')
  +'</div>'
  +'<div class="section-title"><h2>Recent Screenshots</h2></div>'
  +(recent.length > 0 ? '<div class="shot-grid">'+recent.map(shotCard).join('')+'</div>' : '<div class="empty-state"><div class="title">No memories yet</div><div class="sub">Head to the Upload tab to add some screenshots!</div></div>')
  +'</div>';
}

/* ============================== SHARED COMPONENTS ============================== */
function intentBadge(intent, size){
  const cls = size==="md" ? "badge-intent md" : "badge-intent";
  return '<span class="'+cls+'">'+ (INTENT_ICON[intent]||"") +' '+intent+'</span>';
}
function categoryTag(cat){
  const s=CATEGORY_STYLE[cat];
  return '<span class="badge-category" style="background:'+s.bg+';color:'+s.color+'">'+icon(s.icon,11,s.color,2.5)+cat+'</span>';
}
function relevanceBar(score){
  return '<div class="relevance"><div class="relevance-track"><div class="relevance-fill" style="width:'+score+'%"></div></div><span class="relevance-num">'+score+'%</span></div>';
}
function shotVisual(item, opts){
  opts = opts || {};
  const s = CATEGORY_STYLE[item.category];
  const h = opts.height || "112px";

  // NEW: Render the real uploaded image as a background if available
  if (item.imageUrl) {
    return '<div class="shot-visual" style="height:'+h+';border:1px solid var(--border); background-image:url(\''+item.imageUrl+'\'); background-size:cover; background-position:top center;">'
      +(opts.scanning ? '<div class="scanline"></div>' : '')
      +'<div style="position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:'+s.bg+';border:1px solid '+s.color+'55;display:flex;align-items:center;justify-content:center;">'+icon(s.icon,12,s.color,2.25)+'</div>'
    +'</div>';
  }

  let inner = "";
  if(item.category==="Shopping"){
    inner = '<div style="height:50%;border-radius:6px;background:#fff;border:1px solid var(--border);margin-bottom:8px;"></div>'
      +'<div style="height:8px;width:75%;border-radius:4px;background:'+s.color+';opacity:.35;margin-bottom:6px;"></div>'
      +'<div style="height:8px;width:33%;border-radius:4px;background:'+s.color+';opacity:.6;"></div>';
  } else if(item.category==="Travel"){
    inner = '<div style="flex:1;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#fff;border:1px dashed var(--border-strong);">'
      +'<div style="width:8px;height:8px;border-radius:50%;background:'+s.color+';"></div>'
      +'<div style="flex:1;margin:0 8px;height:1px;background:var(--border-strong);"></div>'
      +icon("plane",14,s.color)+'</div>';
  } else if(item.category==="Recipes"){
    inner = '<div style="flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center;">'
      +[0,1,2].map(i=>'<div style="height:6px;border-radius:3px;width:'+(70-i*15)+'%;background:'+s.color+';opacity:'+(0.4+i*0.1)+';"></div>').join('')
      +'</div>';
  } else if(item.category==="Bills"){
    inner = '<div style="flex:1;border-radius:6px;padding:8px;background:#fff;border:1px solid var(--border);">'
      +[0,1,2].map(()=>'<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><div style="height:6px;width:32px;border-radius:3px;background:var(--border);"></div><div style="height:6px;width:20px;border-radius:3px;background:'+s.color+';opacity:.5;"></div></div>').join('')
      +'</div>';
  } else if(item.category==="Education"){
    inner = '<div style="flex:1;border-radius:6px;padding:8px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:repeating-linear-gradient(#fff,#fff 6px,var(--border) 7px);">'
      +[0,1,2].map(i=>'<div style="height:4px;border-radius:2px;width:'+(80-i*10)+'%;background:'+s.color+';opacity:.4;"></div>').join('')
      +'</div>';
  } else {
    inner = '<div style="flex:1;border-radius:6px;padding:10px;background:#fff;border:1px solid var(--border);">'
      +'<div style="height:6px;width:50%;border-radius:3px;background:'+s.color+';opacity:.5;margin-bottom:8px;"></div>'
      +[0,1,2].map(()=>'<div style="height:4px;width:100%;border-radius:2px;background:var(--border);margin-bottom:4px;"></div>').join('')
      +'</div>';
  }
  return '<div class="shot-visual" style="height:'+h+';background:'+s.bg+';border:1px solid var(--border);">'
    +'<div class="shot-visual-inner">'+inner+'</div>'
    +(opts.scanning ? '<div class="scanline"></div>' : '')
    +'<div style="position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:'+s.bg+';border:1px solid '+s.color+'55;display:flex;align-items:center;justify-content:center;">'+icon(s.icon,12,s.color,2.25)+'</div>'
  +'</div>';
}
function shotCard(item){
  return '<button class="shot-card" onclick=\'openDetail("'+item.id+'")\'>'
    +shotVisual(item)
    +'<div class="shot-card-body">'
      +'<div class="shot-card-title">'+item.title+'</div>'
      +'<div class="shot-card-tags">'+categoryTag(item.category)+intentBadge(item.intent)+'</div>'
      +(item.score !== undefined ? relevanceBar(item.score) : '<div class="shot-card-summary">'+item.summary+'</div>')
    +'</div>'
  +'</button>';
}
function stepChecklist(steps, activeIndex){
  return steps.map((step,i)=>{
    let dot;
    if(i<activeIndex) dot = icon("check",15,"var(--brand)",3);
    else if(i===activeIndex) dot = '<div class="step-dot-active"></div>';
    else dot = '<div class="step-dot-pending"></div>';
    return '<div class="step-item"><span style="display:flex;">'+dot+'</span><span style="color:'+(i<activeIndex||i===activeIndex?"var(--ink)":"var(--faint)")+'">'+step+'</span></div>';
  }).join('');
}

/* ============================== SEARCH VIEW ============================== */
function startTextSearch(q){
  const sr = state.search;
  clearTimers(sr.timers);
  sr.query = q || ""; if(!sr.query){ sr.stage="idle"; return; }
  sr.stage="loading"; sr.step=0;
  const steps=["Reading your query","Understanding intent","Finding related memories","Ranking results"];
  steps.forEach((_,i)=>{ sr.timers.push(setTimeout(()=>{ sr.step=i+1; render(); }, 320*(i+1))); });
  sr.timers.push(setTimeout(()=>{
    const r = runSearch(sr.query); sr.results=r.results; sr.label=r.label; sr.stage="done"; render();
  }, 320*steps.length+150));
}
function startCategorySearch(cat){
  const sr = state.search;
  clearTimers(sr.timers);
  sr.query=""; sr.stage="loading"; sr.step=0;
  const steps=["Reading your query","Understanding intent","Finding related memories","Ranking results"];
  steps.forEach((_,i)=>{ sr.timers.push(setTimeout(()=>{ sr.step=i+1; render(); }, 320*(i+1))); });
  sr.timers.push(setTimeout(()=>{
    const base=[95,90,86,82,78];
    // Filter from uploaded memories
    sr.results = state.uploadedMemories.filter(d=>d.category===cat).map((it,i)=>Object.assign({},it,{score:base[i] !== undefined ? base[i] : 70}));
    sr.label = "saved under "+cat; sr.stage="done"; render();
  }, 320*steps.length+150));
}
function searchSubmit(e){
  e.preventDefault();
  const val = document.getElementById("search-page-input").value;
  startTextSearch(val); render();
}
function searchChip(text){
  document.getElementById("search-page-input") && (document.getElementById("search-page-input").value = text);
  startTextSearch(text); render();
}
function renderSearch(){
  const sr = state.search;
  const steps=["Reading your query","Understanding intent","Finding related memories","Ranking results"];
  let body = '<div class="container fade-in">'
    +'<h1 class="display" style="font-size:20px;font-weight:600;margin:0 0 4px;">What are you looking for?</h1>'
    +'<p style="font-size:14px;color:var(--sub);margin:0 0 20px;">Search by meaning — not filenames.</p>'
    +'<form class="search-form" onsubmit="searchSubmit(event)">'
      +'<span class="search-icon">'+icon("search",17,"var(--faint)")+'</span>'
      +'<input id="search-page-input" class="search-input" style="padding-right:96px;" placeholder="things I wanted to buy" value="'+(sr.query||"")+'" />'
      +'<button type="submit" class="btn-primary-sm search-submit">Search</button>'
    +'</form>'
    +'<div class="chip-row">'+SUGGESTED_SEARCHES.map(s=>'<button class="chip" onclick=\'searchChip("'+s.replace(/'/g,"\\'")+'")\'>'+s+'</button>').join('')+'</div>';

  if(sr.stage==="loading"){
    body += '<div class="step-panel"><p style="font-size:14px;font-weight:500;margin:0 0 16px;">Understanding your memory...</p>'+stepChecklist(steps, sr.step)+'</div>';
  } else if(sr.stage==="done" && sr.results.length>0){
    body += '<p style="font-size:14px;color:var(--sub);margin:0 0 16px;">Found <span class="mono" style="font-weight:500;color:var(--ink);">'+sr.results.length+'</span> relevant memories — '+sr.label+'</p>'
      +'<div class="shot-grid">'+sr.results.map(shotCard).join('')+'</div>';
  } else if(sr.stage==="done" && sr.results.length===0){
    body += '<div class="empty-state"><div class="title">No memories found</div><div class="sub">Try describing what you remember differently, or ensure you have uploaded screenshots related to your search.</div></div>';
  }
  body += '</div>';
  return body;
}

/* ============================== REAL FILE UPLOAD LOGIC ============================== */
// Mocks an AI assigning properties to a real uploaded image
function createMockMetadata(filename, dataUrl) {
    const catIndex = Math.floor(Math.random() * CATEGORIES.length);
    const category = CATEGORIES[catIndex];
    
    const intentMap = {
        "Shopping": "Buy Later", "Travel": "Upcoming Travel",
        "Recipes": "Cook Later", "Bills": "Pay Later",
        "Education": "Study Later", "Documents": "Reference Later"
    };

    // Clean up filename to use as a placeholder title
    let formattedTitle = filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
    if(formattedTitle.length > 25) formattedTitle = formattedTitle.substring(0, 25) + '...';
    
    return {
        id: 'up_' + Date.now() + Math.random().toString(36).substr(2, 5),
        category: category,
        title: formattedTitle,
        intent: intentMap[category],
        price: "",
        date: new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}),
        keywords: ["Uploaded", category, "Screenshot"],
        summary: "This is a real screenshot you uploaded. AI classification is simulated in this prototype.",
        why: "Manually uploaded via the prototype interface.",
        imageUrl: dataUrl
    };
}

function processFiles(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    const remainingSlots = 10 - state.upload.files.length;
    
    if (remainingSlots <= 0) {
        alert("You have reached the maximum limit of 10 screenshots.");
        return;
    }

    const filesToProcess = files.slice(0, remainingSlots);
    if (files.length > remainingSlots) {
        alert("Only the first " + remainingSlots + " images were added to respect the 10-file limit.");
    }

    filesToProcess.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const newMemory = createMockMetadata(file.name, ev.target.result);
            state.upload.files.push(newMemory);
            render();
        };
        reader.readAsDataURL(file);
    });
}

function uploadHandleInput(e) {
    processFiles(e.target.files);
    // Reset input value so the same file can be uploaded again if needed
    e.target.value = null;
}

function uploadRemove(id){
  state.upload.files = state.upload.files.filter(f=>f.id!==id);
  render();
}
function uploadDragOver(e){ e.preventDefault(); state.upload.dragOver=true; render(); }
function uploadDragLeave(){ state.upload.dragOver=false; render(); }
function uploadDrop(e){
  e.preventDefault(); state.upload.dragOver=false;
  processFiles(e.dataTransfer.files);
}

function uploadAnalyze(){
  const up = state.upload;
  up.stage="processing"; up.step=0;
  const steps=["Reading screenshot","Extracting information","Detecting category","Inferring intent","Creating searchable memory"];
  clearTimers(up.timers);
  steps.forEach((_,i)=>{ up.timers.push(setTimeout(()=>{ up.step=i+1; render(); }, 380*(i+1))); });
  
  up.timers.push(setTimeout(()=>{ 
    up.stage="done"; 
    // Push completed files to the uploaded memories array so search can find them
    up.files.forEach(file => {
       if(!state.uploadedMemories.find(m => m.id === file.id)) {
           state.uploadedMemories.push(file);
       }
    });
    render(); 
  }, 380*steps.length+200));
  render();
}

function renderUpload(){
  const up = state.upload;
  const steps=["Reading screenshot","Extracting information","Detecting category","Inferring intent","Creating searchable memory"];
  let body = '<div class="container-sm fade-in">'
    +'<h1 class="display" style="font-size:20px;font-weight:600;margin:0 0 4px;">Add to your memory</h1>'
    +'<p style="font-size:14px;color:var(--sub);margin:0 0 24px;">Upload real screenshots to test the prototype (AI classification is simulated).</p>';

  if(up.stage==="select"){
    body += '<div class="dropzone'+(up.dragOver?' drag':'')+'" ondragover="uploadDragOver(event)" ondragleave="uploadDragLeave()" ondrop="uploadDrop(event)">'
      +'<div class="dropzone-icon">'+icon("upload",19,"var(--brand)")+'</div>'
      +'<p style="font-size:14px;font-weight:500;margin:0 0 4px;">Drop real screenshots here</p>'
      +'<p style="font-size:12px;color:var(--faint);margin:0 0 16px;">PNG, JPG, JPEG, WEBP (Max 10)</p>'
      +'<input type="file" id="real-file-upload" multiple accept="image/*" style="display:none;" onchange="uploadHandleInput(event)" />'
      +'<button class="btn-primary-sm" style="padding:8px 16px;" onclick="document.getElementById(\'real-file-upload\').click()">Choose Files</button>'
    +'</div>';
    if(up.files.length>0){
      body += '<p style="font-size:14px;font-weight:500;margin:0 0 12px;">'+up.files.length+' screenshot'+(up.files.length>1?'s':'')+' selected</p>'
        +'<div class="upload-preview-grid">'
          +up.files.map(f=>'<div class="upload-preview-item">'+shotVisual(f,{height:"80px"})+'<button class="upload-remove" onclick=\'uploadRemove("'+f.id+'")\'>'+icon("x",11,"#fff")+'</button></div>').join('')
          +(up.files.length < 10 ? '<button class="upload-add-btn" onclick="document.getElementById(\'real-file-upload\').click()">+ Add More</button>' : '')
        +'</div>'
        +'<button class="btn-primary" onclick="uploadAnalyze()">Analyze Screenshots</button>';
    }
  } else if(up.stage==="processing"){
    body += '<div class="step-panel" style="max-width:none;">'
      +'<div style="display:flex;gap:8px;margin-bottom:20px;">'+up.files.slice(0,4).map(f=>shotVisual(f,{height:"56px",scanning:true})).join('')+'</div>'
      +'<p style="font-size:14px;font-weight:500;margin:0 0 16px;">Analyzing your screenshots...</p>'
      +stepChecklist(steps, up.step)
    +'</div>';
  } else if(up.stage==="done"){
    body += '<div class="fade-in">'
      +'<div style="border-radius:12px;padding:20px;background:var(--brand-dim);display:flex;align-items:center;gap:12px;margin-bottom:24px;">'
        +icon("check",18,"var(--brand)",3)
        +'<p style="font-size:14px;font-weight:500;color:var(--brand-ink);margin:0;">'+up.files.length+' '+(up.files.length>1?'memories':'memory')+' added</p>'
      +'</div>'
      +'<div class="shot-grid cols-3">'+up.files.map(shotCard).join('')+'</div>'
    +'</div>';
  }
  body += '</div>';
  return body;
}

/* ============================== DETAIL VIEW ============================== */
function detailDeleteAsk(){ state.deleteConfirm=true; render(); }
function detailDeleteCancel(){ state.deleteConfirm=false; render(); }
function detailDeleteConfirm(){ 
  // Remove from our uploaded memories
  state.uploadedMemories = state.uploadedMemories.filter(m => m.id !== state.selectedId);
  state.deleted=true; 
  render(); 
}
function renderDetail(){
  // Grab the correct item from our uploaded state
  const item = state.uploadedMemories.find(d=>d.id===state.selectedId);
  if(!item && !state.deleted) return '<div class="container">Not found. Please return to dashboard.</div>';
  
  if(state.deleted){
    return '<div class="container-md fade-in" style="text-align:center;padding-top:80px;">'
      +'<p class="display" style="font-size:16px;font-weight:500;margin:0 0 8px;">Memory deleted</p>'
      +'<button style="font-size:14px;font-weight:500;color:var(--brand);" onclick="navigate(\'dashboard\')">← Back to your memories</button>'
    +'</div>';
  }
  
  const related = state.uploadedMemories.filter(d=>d.category===item.category && d.id!==item.id).slice(0,3);
  const rows = [
    {n:"01",label:"Category",value:categoryTag(item.category)},
    {n:"02",label:"Intent",value:intentBadge(item.intent,"md")},
    {n:"03",label:"Key information",value:'<span style="font-size:14px;">'+item.title+(item.price?' · '+item.price:'')+(item.location?' · '+item.location:'')+'</span>'},
    {n:"04",label:"Why you might have saved it",value:'<span style="font-size:14px;color:var(--sub);">'+item.why+'</span>'}
  ];
  
  let deleteBlock;
  if(!state.deleteConfirm){
    deleteBlock = '<button style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--bills);" onclick="detailDeleteAsk()">'+icon("trash",14,"var(--bills)")+'Delete this memory</button>';
  } else {
    deleteBlock = '<div class="delete-confirm">'
      +'<span style="font-size:14px;color:#8A362F;">Delete "'+item.title+'" permanently?</span>'
      +'<div style="display:flex;gap:8px;">'
        +'<button class="btn-secondary-sm" onclick="detailDeleteCancel()">Cancel</button>'
        +'<button class="btn-primary-sm" style="background:var(--bills);" onclick="detailDeleteConfirm()">Delete</button>'
      +'</div>'
    +'</div>';
  }
  
  return '<div class="container-sm fade-in">'
    +'<button class="back-btn" onclick="backFromDetail()">'+icon("chevronLeft",15)+' Back</button>'
    +'<h1 class="display" style="font-size:20px;font-weight:600;margin:0 0 20px;">'+item.title+'</h1>'
    +shotVisual(item,{height:"320px"}) // Adjusted height for detail view of real image
    +'<div class="ai-read-tag">'+icon("sparkles",12,"var(--brand)")+' AI Read · '+item.date+'</div>'
    +'<div class="understand-panel">'
      +'<p class="display" style="font-size:14px;font-weight:600;margin:0 0 16px;">MemoryLens understood this screenshot</p>'
      +rows.map(r=>'<div class="understand-row"><span class="understand-num">'+r.n+'</span><div style="flex:1;"><div class="understand-label">'+r.label+'</div>'+r.value+'</div></div>').join('')
    +'</div>'
    +'<p style="font-size:14px;margin:0 0 8px;">Summary</p>'
    +'<p style="font-size:14px;color:var(--sub);margin:0 0 24px;">'+item.summary+'</p>'
    +'<p style="font-size:14px;margin:0 0 8px;">Keywords</p>'
    +'<div class="chip-row" style="margin-bottom:8px;">'+item.keywords.map(k=>'<span class="keyword-chip">'+k+'</span>').join('')+'</div>'
    +(related.length>0 ? '<p class="display" style="font-size:14px;font-weight:600;margin:24px 0 12px;">Related Memories</p><div class="shot-grid cols-3" style="margin-bottom:24px;">'+related.map(shotCard).join('')+'</div>' : '')
    +deleteBlock
  +'</div>';
}

/* ============================== CHAT VIEW ============================== */
function chatSend(text){
  text = (text||"").trim();
  if(!text) return;
  const c = state.chat;
  c.messages.push({role:"user", text:text});
  c.input=""; c.typing=true;
  render();
  setTimeout(()=>{
    const a = answerFor(text);
    c.messages.push({role:"assistant", text:a.text, sources:a.sources});
    c.typing=false;
    render();
  }, 900);
}
function chatSubmit(e){
  e.preventDefault();
  const val = document.getElementById("chat-input-el").value;
  chatSend(val);
}
function chatChip(text){ chatSend(text); }
function renderChat(){
  const c = state.chat;
  let body = '<div class="container-md fade-in">'
    +'<div class="chat-wrap">'
    +'<h1 class="display" style="font-size:20px;font-weight:600;margin:0 0 4px;">MemoryLens AI</h1>'
    +'<p style="font-size:14px;color:var(--sub);margin:0 0 20px;">Ask anything about your screenshots.</p>';

  if(c.messages.length===0){
    body += '<div class="chip-row">'+CHAT_SUGGESTIONS.map(s=>'<button class="chip" onclick=\'chatChip("'+s.replace(/'/g,"\\'")+'")\'>'+s+'</button>').join('')+'</div>';
  }

  body += '<div class="chat-messages">';
  c.messages.forEach(m=>{
    body += '<div class="bubble-row '+m.role+'"><div style="max-width:100%;">'
      +'<div class="bubble '+m.role+'">'+m.text+'</div>';
    if(m.sources && m.sources.length>0){
      body += '<div class="bubble-sources">'+m.sources.map(s=>
        '<button class="bubble-source-card" onclick=\'openDetail("'+s.id+'")\'>'+shotVisual(s,{height:"48px"})+'<div class="bubble-source-title">'+s.title+'</div></button>'
      ).join('')+'</div>';
    }
    body += '</div></div>';
  });
  if(c.typing){
    body += '<div class="bubble-row assistant"><div class="typing-bubble"><span class="typing-dot" style="animation-delay:0s;"></span><span class="typing-dot" style="animation-delay:.15s;"></span><span class="typing-dot" style="animation-delay:.3s;"></span></div></div>';
  }
  body += '</div>';

  body += '<form class="chat-input-form" onsubmit="chatSubmit(event)">'
    +'<input id="chat-input-el" class="chat-input" placeholder="Ask about your memories..." />'
    +'<button type="submit" class="chat-send">'+icon("send",13,"#fff")+'</button>'
  +'</form>';

  body += '</div></div>';
  return body;
}

/* ============================== SHELL ============================== */
function renderSidebar(){
  const currentCounts = getCategoryCounts();
  return '<aside class="sidebar">'
    +'<div style="padding:0 8px;margin-bottom:28px;"><div class="logo"><div class="logo-mark">'+icon("sparkles",16,"#fff")+'</div><span class="logo-text display">MemoryLens</span></div></div>'
    +'<nav style="margin-bottom:24px;">'+NAV_ITEMS.map(item=>{
      const active = state.view===item.id;
      return '<button class="nav-item'+(active?' active':'')+'" onclick=\'navigate("'+item.id+'")\'>'+icon(item.icon,16)+item.label+'</button>';
    }).join('')+'</nav>'
    +'<div class="nav-section-label">Categories</div>'
    +'<nav style="flex:1;overflow-y:auto;">'+CATEGORIES.map(cat=>{
      const s=CATEGORY_STYLE[cat];
      return '<button class="cat-nav-item" onclick=\'openCategory("'+cat+'")\'><span style="display:flex;align-items:center;gap:10px;">'+icon(s.icon,15,s.color)+cat+'</span><span class="cat-count">'+currentCounts[cat]+'</span></button>';
    }).join('')+'</nav>'
    +'<button class="nav-item" style="margin-top:8px;">'+icon("settings",16)+'Settings</button>'
  +'</aside>';
}
function renderMobileTop(){
  return '<div class="mobile-top"><div class="logo"><div class="logo-mark" style="width:26px;height:26px;">'+icon("sparkles",13,"#fff")+'</div><span class="logo-text display" style="font-size:16px;">MemoryLens</span></div></div>';
}
function renderMobileTab(){
  return '<nav class="mobile-tab">'+NAV_ITEMS.map(item=>{
    const active = state.view===item.id;
    return '<button class="mobile-tab-item'+(active?' active':'')+'" onclick=\'navigate("'+item.id+'")\'>'+icon(item.icon,19,active?"var(--brand)":"var(--faint)")+'<span>'+item.label+'</span></button>';
  }).join('')+'</nav>';
}

function render(){
  let content;
  if(state.view==="dashboard") content = renderDashboard();
  else if(state.view==="search") content = renderSearch();
  else if(state.view==="upload") content = renderUpload();
  else if(state.view==="chat") content = renderChat();
  else if(state.view==="detail") content = renderDetail();

  document.getElementById("root").innerHTML =
    renderSidebar()
    +'<div class="main-col">'
      + renderMobileTop()
      + '<div class="view-wrap">' + content + '</div>'
    +'</div>'
    + renderMobileTab();
}

render();
</script>
</body>
</html>
